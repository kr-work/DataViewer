# Release: タグ（v*）を push すると、Windows と Ubuntu の実行ファイルを作って GitHub の Release に載せる。
# 手動実行（Actions の画面の Run workflow）では、実行ファイルを作って成果物（Artifacts）に置くだけで、Release は作らない。
#
# 実行ファイルには、同梱したライブラリのライセンス文書を自動で入れる（packaging/build_release.py。
# 出どころの分からないファイルがあればビルドを止める）。手順の理由は THIRD_PARTY_NOTICES.md と docs/DECISIONS.md を参照。
name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu は版を固定する（作った環境より古い Ubuntu では動かないため、対象を明示する）。
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON_DOWNLOADS: never
      PYTHONUTF8: "1"  # 日本語の出力のため（Windows の Actions では標準出力が cp1252 になる）
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      # uv が入れる Python は OpenSSL などを内部に組み込んでいて、その文書も同梱が要る。setup-python の Python は
      # それらを OS のライブラリとして使うので、同梱しない（packaging/ExperimentWorkbench.spec）。
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --no-dev --group build --python "${{ steps.python.outputs.python-path }}"
      - name: Build
        run: uv run --no-dev --group build python packaging/build_release.py --expected-version "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ExperimentWorkbench-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/release-notes.md
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*/*.zip artifacts/*/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file artifacts/ExperimentWorkbench-Linux/release-notes.md \
            --generate-notes
